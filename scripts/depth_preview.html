<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet">
<style>body{margin:0}#map{position:fixed;inset:0}</style>
</head>
<body>
<div id="map"></div>
<script>
mapboxgl.accessToken = "pk.eyJ1IjoiZGptb3JnYW40NCIsImEiOiJjbWVlY3VwbTEwa2RrMmxweDg1cDNlZWtzIn0.2TBPXpr9fMOO1K3O5ygRXA";
const map = new mapboxgl.Map({
  container: "map",
  style: "mapbox://styles/mapbox/dark-v11",
  center: [-96.475, 33.07],  // Lavon
  zoom: 12
});
map.on("load", () => {
  map.addSource("lavon-depth", {
    type: "raster",
    tiles: ["http://localhost:8000/lavon_tiles/{z}/{x}/{y}.png"],
    tileSize: 256, minzoom: 10, maxzoom: 16
  });
  map.addLayer({
    id: "depth-ramp",
    type: "raster",
    source: "lavon-depth",
    paint: {
      // decode Terrain-RGB to meters: R*6553.6 + G*25.6 + B*0.1 - 10000
      "raster-color-mix": [1671168, 6528, 25.5, -10000],
      "raster-color-range": [-14, 0],   // lakebed is negative meters
      "raster-color": [
        "interpolate", ["linear"], ["raster-value"],
        -14, "#04122b",   // deepest holes: near-black navy
        -9,  "#0c3a5e",
        -5,  "#19708c",
        -2,  "#3fb3a5",
        0,   "#bfeee6"    // shoreline flats: pale teal
      ],
      "raster-opacity": 0.85,
      "raster-resampling": "linear"
    }
  });
  map.addSource("lavon-contours", {
    type: "geojson",
    data: "http://localhost:8000/lavon_contours.geojson"
  });
  map.addLayer({
    id: "depth-contours",
    type: "line",
    source: "lavon-contours",
    paint: {
      "line-color": "#B08840",
      "line-width": ["case", ["==", ["%", ["get", "depth_ft"], 10], 0], 1.2, 0.4],
      "line-opacity": 0.55
    }
  });
});
</script>
</body>
</html>
